<!doctype html>
<html lang="zh-TW" class="h-full bg-slate-50">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{% block title %}投資儀表板{% endblock %} · Investment Platform</title>
  <link rel="icon" href="/static/favicon.ico" />
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/chart.umd.min.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body class="h-full text-slate-900 antialiased">
  {% include "components/nav.html" %}
  <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="mt-12 border-t border-slate-200 py-6 text-center text-xs text-slate-500">
    Investment Platform v{{ app_version }} · {{ "now"|default("") }}
  </footer>
</body>
</html>
