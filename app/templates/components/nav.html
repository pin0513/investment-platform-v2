<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
    <a href="{% if user %}/{{ user.slug }}/{% else %}/{% endif %}"
       class="text-lg font-semibold text-slate-900">
      📊 投資儀表板
    </a>
    {% if user %}
    <nav class="hidden gap-4 text-sm font-medium text-slate-600 sm:flex">
      <a href="/{{ user.slug }}/" class="hover:text-slate-900">總覽</a>
      <a href="/{{ user.slug }}/portfolio" class="hover:text-slate-900">持倉</a>
      <a href="/{{ user.slug }}/transactions" class="hover:text-slate-900">交易紀錄</a>
      <a href="/{{ user.slug }}/settings" class="hover:text-slate-900">設定</a>
      <a href="/auth/logout" class="text-slate-400 hover:text-slate-900">登出</a>
    </nav>
    <button type="button"
            class="rounded-md p-2 text-slate-500 sm:hidden"
            onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
      <span class="sr-only">Open menu</span>
      ☰
    </button>
    {% endif %}
  </div>
  {% if user %}
  <nav id="mobile-menu" class="hidden border-t border-slate-200 bg-slate-50 sm:hidden">
    <div class="space-y-1 px-4 py-2 text-sm">
      <a href="/{{ user.slug }}/" class="block py-2">總覽</a>
      <a href="/{{ user.slug }}/portfolio" class="block py-2">持倉</a>
      <a href="/{{ user.slug }}/transactions" class="block py-2">交易紀錄</a>
      <a href="/{{ user.slug }}/settings" class="block py-2">設定</a>
      <a href="/auth/logout" class="block py-2 text-slate-400">登出</a>
    </div>
  </nav>
  {% endif %}
</header>
