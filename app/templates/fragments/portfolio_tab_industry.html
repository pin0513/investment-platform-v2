<div class="rounded-lg bg-white p-4 shadow">
  <table class="w-full text-sm">
    <thead class="text-left text-xs uppercase tracking-wide text-slate-500">
      <tr>
        <th class="py-2">產業</th>
        <th class="num py-2">市值</th>
        <th class="num py-2">%</th>
        <th class="num py-2">標的數</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
      {% for g in summary.by_industry %}
      <tr>
        <td class="py-2">{{ g.label }}</td>
        <td class="num py-2">{{ g.value | currency_fmt(summary.base_currency) }}</td>
        <td class="num py-2">{{ g.pct }}%</td>
        <td class="num py-2">{{ g.count }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
